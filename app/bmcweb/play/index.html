<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Butchies Media Center | Player</title><link rel="stylesheet" href="play.css"></head><body><main class="shell"><header class="top"><div class="brand">BUTCHIES MEDIA CENTER · PLAYER</div><a class="pill" id="back" href="#">← Zurück</a></header><h1 class="title" id="title"></h1><section class="player" id="player"><video class="screen" id="video" playsinline preload="metadata"></video><canvas id="pgs" hidden></canvas><div class="controls" id="controls"><div class="seekwrap"><input class="progress" id="seek" type="range" min="0" max="1000" value="0" aria-label="Wiedergabeposition"><div class="marks" id="marks"></div></div><div class="toolbar"><button id="previous" title="Vorheriger Titel">⏮</button><button id="rew" title="10 Sekunden zurück">↶ 10</button><button id="play" title="Abspielen oder Pause">▶</button><button id="forward" title="10 Sekunden vor">10 ↷</button><button id="next" title="Nächster Titel">⏭</button><span class="time" id="clock">00:00 / 00:00</span><span class="spacer"></span><button id="mute" title="Stumm">🔊</button><input id="volume" type="range" min="0" max="1" step=".01" value="1" aria-label="Lautstärke" style="width:80px"><button id="subToggle" title="Untertitel">CC</button><button id="pip" title="Bild im Bild">▣</button><button id="fullscreen" title="Vollbild">⛶</button></div></div></section><div class="state" id="status" role="status">Wird geladen …</div><section class="panel"><article class="card"><h2>Wiedergabeeinstellungen</h2><div class="row"><label for="speed">Tempo</label><select id="speed"><option value=".5">0,5×</option><option value=".75">0,75×</option><option value="1" selected>1×</option><option value="1.25">1,25×</option><option value="1.5">1,5×</option><option value="2">2×</option></select></div><div class="row"><label for="audio">Tonspur</label><select id="audio"></select></div><div class="row"><label for="subtitle">Untertitel</label><select id="subtitle"><option value="off">Aus</option></select></div><div class="row"><label for="offset">Versatz</label><input id="offset" type="number" value="0" step=".5" style="width:100px"><span class="caption">Sekunden (+ = später, − = früher)</span></div><div class="row"><label for="autonext">Autoplay</label><input id="autonext" type="checkbox" checked><span class="caption">Nächsten Titel automatisch abspielen</span></div><div class="row"><label for="sleep">Schlaftimer</label><select id="sleep"><option value="0">Aus</option><option value="15">15 Minuten</option><option value="30">30 Minuten</option><option value="45">45 Minuten</option><option value="60">60 Minuten</option><option value="90">90 Minuten</option><option value="120">120 Minuten</option><option value="end">Ende dieses Titels</option></select><span class="caption" id="sleepLeft"></span></div><p class="muted">Leertaste: Pause · ←/→: 10 Sekunden · F: Vollbild · M: Stumm · N: Nächster Titel</p></article><article class="card"><h2 id="listTitle">Wiedergabeliste</h2><ol id="queue" class="queue"></ol><p class="caption" id="listNote"></p></article></section></main><script src="../player/pgs.js"></script><script src="play.js"></script></body></html>
