<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Jellyfin</title>
<link rel="stylesheet" href="player.css?v=2">
</head>
<body>
<div id="stage">
  <canvas id="screen"></canvas>
  <canvas id="pgs"></canvas>
  <div id="subs"></div>
  <div id="spinner"><div class="ring"></div><div id="spinText"></div></div>
  <button id="soundHint" hidden><svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg><span>Für Ton tippen</span></button>
  <div id="toast" hidden></div>
  <div id="error" hidden><div class="box"><h2 id="errTitle">Wiedergabefehler</h2><p id="errText"></p><button id="errBack">Verstanden</button></div></div>
  <div id="menu" hidden><div class="list"></div></div>
  <div id="ui">
    <div class="top">
      <button id="back" class="ic" title="Zurück" aria-label="Zurück"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
      <div class="ttl"><div id="title"></div><div id="sub"></div></div>
    </div>
    <div class="bottom">
      <div class="bar"><span id="cur">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Position"><span id="rest">-0:00</span></div>
      <div class="row">
        <button id="rew" class="ic" title="Zurückspulen" aria-label="Zurückspulen"><svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg></button>
        <button id="play" class="ic" title="Pause" aria-label="Abspielen/Pause"><svg viewBox="0 0 24 24"><path id="playIcon" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg></button>
        <button id="fwd" class="ic" title="Vorspulen" aria-label="Vorspulen"><svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg></button>
        <span id="endsAt"></span>
        <span class="sp"></span>
        <button id="fav" class="ic" title="Favorit" aria-label="Favorit"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></button>
        <button id="subBtn" class="ic" title="Untertitel" aria-label="Untertitel" hidden><svg viewBox="0 0 24 24"><path d="M19 4H5c-1.11 0-2 .9-2 2v12c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 7H9.5v-.5h-2v3h2V13H11v1c0 .55-.45 1-1 1H7c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1h3c.55 0 1 .45 1 1v1zm7 0h-1.5v-.5h-2v3h2V13H18v1c0 .55-.45 1-1 1h-3c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1h3c.55 0 1 .45 1 1v1z"/></svg></button>
        <button id="audioBtn" class="ic" title="Audio" aria-label="Audio" hidden><svg viewBox="0 0 24 24"><path d="M12 3v9.28c-.47-.17-.97-.28-1.5-.28C8.01 12 6 14.01 6 16.5S8.01 21 10.5 21c2.31 0 4.2-1.75 4.45-4H15V6h4V3h-7z"/></svg></button>
        <button id="mute" class="ic" title="Stumm" aria-label="Stumm"><svg viewBox="0 0 24 24"><path id="volIcon" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></button>
        <input id="vol" type="range" min="0" max="100" value="100" aria-label="Lautstärke">
        <button id="full" class="ic" title="Vollbild" aria-label="Vollbild"><svg viewBox="0 0 24 24"><path id="fullIcon" d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg></button>
      </div>
    </div>
  </div>
  <select id="audioSel" hidden></select><select id="subSel" hidden></select><button id="stop" hidden></button>
</div>
<script src="pgs.js?v=1"></script>
<script src="player.js?v=2"></script>
</body>
</html>
